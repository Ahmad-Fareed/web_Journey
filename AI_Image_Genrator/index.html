<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="generator-card">
            <div class="header">
                <div class="title-section">
                    <span class="icon">✨</span>
                    <h1>AI Image Generator</h1>
                </div>
                <button class="theme-toggle" id="themeToggle">🌙</button>
            </div>

            <form class="generator-form">
                <!-- Input Section -->
                <div class="input-section">
                    <textarea 
                        class="prompt-input" 
                        placeholder="Describe your imagination in detail..."
                        rows="4"
                    ></textarea>
                </div>

                <!-- Prompt Actions/Buttons -->
                <div class="prompt-actions">
                    <div class="select-wrapper">
                        <select class="custom-select">
                            <option value="" selected disabled>Select Model</option>
                            <option value="black-forest-labs/FLUX.1-schnell">FLUX.1 Schnell (Fast)</option>
                            <option value="stabilityai/stable-diffusion-3-medium-diffusers">Stable Diffusion 3 Medium</option>
                        </select>
                    </div>
                </div>

                <!-- Image Count Selection -->
                <div class="select-wrapper">
                    <select class="custom-select">
                        <option value="" selected disabled>Image Count</option>
                        <option value="1">1 Image</option>
                        <option value="2">2 Images</option>
                        <option value="3">3 Images</option>
                        <option value="4">4 Images</option>
                    </select>
                </div>

                <!-- Aspect Ratio Selection -->
                <div class="select-wrapper">
                    <select class="custom-select">
                        <option value="" selected disabled>Aspect Ratio</option>
                        <option value="1/1">Square (1:1)</option>
                        <option value="16/9">Landscape (16:9)</option>
                        <option value="9/16">Portrait (9:16)</option>
                    </select>
                </div>

                <!-- Generate Button -->
                <button type="submit" class="generate-btn">✨ Generate</button>
            </form>
        </div>

        <!-- Results Section -->
        <div class="results-section">
            <!-- Result Gallery Grid -->
            <div class="gallery-grid" id="gallery">
                <!-- Image cards will be generated here -->
                <!-- Example card structure:
                <div class="img-card">
                    <img src="test.png" class="result-img" />
                    <div class="img-overlay">
                        <button class="img-download-btn">
                            <i class="fa-solid fa-download"></i>
                        </button>
                    </div>
                </div>
                -->
            </div>
        </div>
    </div>

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="script.js"></script>
</body>
</html>
