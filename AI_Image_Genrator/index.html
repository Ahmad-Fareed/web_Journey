<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate stunning AI images from text prompts using Hugging Face models. Free, fast, and beautiful.">
    <title>AI Image Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="generator-card">
            <div class="header">
                <div class="title-section">
                    <span class="icon">✨</span>
                    <h1>AI Image Generator</h1>
                </div>
                <button class="theme-toggle" id="themeToggle">🌙</button>
            </div>

            <form class="generator-form" id="generatorForm">
                <!-- Prompt Input -->
                <div class="input-section">
                    <textarea 
                        class="prompt-input" 
                        id="promptInput"
                        placeholder="Describe your imagination in detail..."
                        rows="4"
                    ></textarea>
                </div>

                <!-- Model Selection -->
                <div class="prompt-actions">
                    <div class="select-wrapper">
                        <select class="custom-select" id="modelSelect">
                            <option value="" selected disabled>Select Model</option>
                            <option value="black-forest-labs/FLUX.1-schnell">FLUX.1 Schnell (Fast)</option>
                            <option value="stabilityai/stable-diffusion-3-medium-diffusers">Stable Diffusion 3 Medium</option>
                        </select>
                    </div>
                </div>

                <!-- Image Count Selection -->
                <div class="select-wrapper">
                    <select class="custom-select" id="countSelect">
                        <option value="" selected disabled>Image Count</option>
                        <option value="1">1 Image</option>
                        <option value="2">2 Images</option>
                        <option value="3">3 Images</option>
                        <option value="4">4 Images</option>
                    </select>
                </div>

                <!-- Aspect Ratio Selection -->
                <div class="select-wrapper">
                    <select class="custom-select" id="ratioSelect">
                        <option value="" selected disabled>Aspect Ratio</option>
                        <option value="1/1">Square (1:1)</option>
                        <option value="16/9">Landscape (16:9)</option>
                        <option value="9/16">Portrait (9:16)</option>
                    </select>
                </div>

                <!-- Generate Button -->
                <button type="submit" class="generate-btn" id="generateBtn">✨ Generate</button>
            </form>
        </div>

        <!-- Results Gallery -->
        <div class="results-section">
            <div class="gallery-grid" id="gallery"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
