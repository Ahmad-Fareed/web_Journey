<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <div class="header">
            <h1>LeetMetric</h1>
        </div>

        <!-- User Input Section -->
        <div class="user-container">
            <p>Enter your username below:</p>
            <div class="user-input-container">
                <input type="text" placeholder="Enter your username here" id="user-input">
                <button id="search-btn">Search</button>
            </div>
        </div>

        <!-- Stats Section -->
        <div class="stats-container">
            <!-- Progress/Percentage Indicators -->
            <div class="progress">
                <!-- Circular progress indicators -->
                <div class="circle-progress" id="progress-1">Easy</div>
                <div class="circle-progress" id="progress-2">Medium</div>
                <div class="circle-progress" id="progress-3">Hard</div>
            </div>

            <!-- Stats Cards Section -->
            <div class="stats-cards">
                <div class="stats-card" id="card-1">
                    <!-- Stats will be populated by JS -->
                </div>
                <div class="stats-card" id="card-2">
                    <!-- Stats will be populated by JS -->
                </div>
                <div class="stats-card" id="card-3">
                    <!-- Stats will be populated by JS -->
                </div>
            </div>
        </div>

        <!-- Additional Container -->
        <div class="div-container">
            <!-- Additional layout container -->
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
